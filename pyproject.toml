[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gsess"
version = "0.1.0"
description = "Save and restore Ghostty tabs/splits including the Claude Code session in each pane"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Reed" }]
keywords = ["ghostty", "claude-code", "terminal", "session-manager", "macos"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Terminals",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zsychn/gsess"
Issues = "https://github.com/zsychn/gsess/issues"

[project.scripts]
gsess = "gsess:main"

[tool.setuptools]
py-modules = ["gsess"]
